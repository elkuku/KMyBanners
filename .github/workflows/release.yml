# A tag v<versionName> (e.g. v0.1.0) builds the signed release APK and publishes it as a GitHub Release.
name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write   # create the release

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'

      - uses: gradle/actions/setup-gradle@v6

      - name: The tag matches the app's versionName
        run: |
          version=$(sed -n 's/.*versionName = "\(.*\)".*/\1/p' app/build.gradle.kts)
          echo "VERSION=$version" >> "$GITHUB_ENV"
          if [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "::error::Tag $GITHUB_REF_NAME, but versionName is $version"
            exit 1
          fi

      - name: Signing key
        env:
          RELEASE_KEYSTORE_BASE64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
        run: echo "$RELEASE_KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"

      - name: Unit tests and signed release APK
        env:
          RELEASE_KEYSTORE_PASSWORD: ${{ secrets.RELEASE_KEYSTORE_PASSWORD }}
        run: |
          ./gradlew --console=plain testDebugUnitTest assembleRelease \
            -Prelease.storeFile="$RUNNER_TEMP/release.jks" -Prelease.storePassword="$RELEASE_KEYSTORE_PASSWORD" \
            -Prelease.keyAlias=kmybanners -Prelease.keyPassword="$RELEASE_KEYSTORE_PASSWORD"
          "$ANDROID_HOME/build-tools/$(ls "$ANDROID_HOME/build-tools" | sort -V | tail -1)/apksigner" verify \
            app/build/outputs/apk/release/app-release.apk
          cp app/build/outputs/apk/release/app-release.apk "kmybanners-$VERSION.apk"

      - name: GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" "kmybanners-$VERSION.apk" --title "KMyBanners $VERSION" --generate-notes --prerelease

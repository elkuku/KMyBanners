name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # AGP 9 needs JDK 17+ to run Gradle; the app itself targets Java 17
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'

      # Caches Gradle and validates the wrapper jar
      - uses: gradle/actions/setup-gradle@v6

      # The runner's Android SDK (ANDROID_HOME) is used; AGP installs missing platforms
      - name: Unit tests, lint and debug build
        run: ./gradlew --console=plain testDebugUnitTest lintDebug assembleDebug

      - name: Upload test and lint reports
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: reports
          path: |
            app/build/reports/
            app/build/test-results/
          retention-days: 7

      - name: Upload debug APK
        uses: actions/upload-artifact@v7
        with:
          name: kmybanners-debug
          path: app/build/outputs/apk/debug/app-debug.apk
          retention-days: 7

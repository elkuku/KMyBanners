# The docs (VitePress, docs/) and the dev app ("KMyBanners Dev", dev.elkuku.kmybanners.dev, next to the
# release app) on GitHub Pages: https://elkuku.github.io/KMyBanners/ and …/kmybanners-dev.apk, built on every
# push to main that changes the app or the docs. Signed with the dev key from the secrets DEV_KEYSTORE_BASE64
# and DEV_KEYSTORE_PASSWORD.
name: Dev build and docs

on:
  push:
    branches: [main]
    paths:
      - 'app/**'
      - 'docs/**'
      - 'gradle/**'
      - '*.gradle.kts'
      - '.github/workflows/dev-build.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'

      - uses: gradle/actions/setup-gradle@v6

      - name: Build the dev APK
        env:
          DEV_KEYSTORE_BASE64: ${{ secrets.DEV_KEYSTORE_BASE64 }}
          DEV_KEYSTORE_PASSWORD: ${{ secrets.DEV_KEYSTORE_PASSWORD }}
        run: |
          echo "$DEV_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/dev.jks"
          ./gradlew --console=plain testDebugUnitTest assembleDev \
            -Pdev.storeFile="$RUNNER_TEMP/dev.jks" -Pdev.storePassword="$DEV_KEYSTORE_PASSWORD" \
            -Pdev.keyAlias=kmybanners-dev -Pdev.keyPassword="$DEV_KEYSTORE_PASSWORD" \
            -Pdev.build="${{ github.run_number }}.${GITHUB_SHA::7}"
          rm "$RUNNER_TEMP/dev.jks"
          "$ANDROID_HOME/build-tools/$(ls "$ANDROID_HOME/build-tools" | sort -V | tail -1)/apksigner" verify \
            app/build/outputs/apk/dev/app-dev.apk

      - name: The dev APK's version
        run: |
          version=$(jq -r '.elements[0].versionName' app/build/outputs/apk/dev/output-metadata.json)
          echo "DEV_APK_VERSION=$version" >> "$GITHUB_ENV"
          echo "Dev APK $version" >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: docs/package-lock.json

      # downloads.data.ts reads the APK's size and DEV_APK_VERSION
      - name: Build the docs
        working-directory: docs
        run: |
          npm ci
          npm run build
          cp ../app/build/outputs/apk/dev/app-dev.apk .vitepress/dist/kmybanners-dev.apk

      - uses: actions/configure-pages@v6

      - uses: actions/upload-pages-artifact@v5
        with:
          path: docs/.vitepress/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5

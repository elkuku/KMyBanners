# The dev app ("KMyBanners Dev", dev.elkuku.kmybanners.dev, next to the release app) on GitHub Pages:
# https://elkuku.github.io/KMyBanners/kmybanners-dev.apk, built on every push to main that changes the app.
# Signed with the dev key from the secrets DEV_KEYSTORE_BASE64 and DEV_KEYSTORE_PASSWORD.
name: Dev build

on:
  push:
    branches: [main]
    paths:
      - 'app/**'
      - 'gradle/**'
      - '*.gradle.kts'
      - '.github/workflows/dev-build.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'

      - uses: gradle/actions/setup-gradle@v6

      - name: Build the dev APK
        env:
          DEV_KEYSTORE_BASE64: ${{ secrets.DEV_KEYSTORE_BASE64 }}
          DEV_KEYSTORE_PASSWORD: ${{ secrets.DEV_KEYSTORE_PASSWORD }}
        run: |
          echo "$DEV_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/dev.jks"
          ./gradlew --console=plain testDebugUnitTest assembleDev \
            -Pdev.storeFile="$RUNNER_TEMP/dev.jks" -Pdev.storePassword="$DEV_KEYSTORE_PASSWORD" \
            -Pdev.keyAlias=kmybanners-dev -Pdev.keyPassword="$DEV_KEYSTORE_PASSWORD" \
            -Pdev.build="${{ github.run_number }}.${GITHUB_SHA::7}"
          rm "$RUNNER_TEMP/dev.jks"
          "$ANDROID_HOME/build-tools/$(ls "$ANDROID_HOME/build-tools" | sort -V | tail -1)/apksigner" verify \
            app/build/outputs/apk/dev/app-dev.apk

      # Until there are docs: a page with the download link
      - name: The page
        run: |
          version=$(jq -r '.elements[0].versionName' app/build/outputs/apk/dev/output-metadata.json)
          size=$(du -k app/build/outputs/apk/dev/app-dev.apk | awk '{printf "%.1f MB", $1/1024}')
          mkdir site
          cp app/build/outputs/apk/dev/app-dev.apk site/kmybanners-dev.apk
          cat > site/index.html <<EOF
          <!doctype html>
          <html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
          <title>KMyBanners</title>
          <style>body{font-family:system-ui,sans-serif;max-width:40rem;margin:2rem auto;padding:0 1rem;line-height:1.5}
          @media (prefers-color-scheme:dark){body{background:#121212;color:#ddd}a{color:#8ab4f8}}</style></head>
          <body><h1>KMyBanners</h1>
          <p>Your Ingress mission banners on a page of your own. <a href="https://github.com/elkuku/KMyBanners">Source</a>.</p>
          <ul>
          <li><a href="https://github.com/elkuku/KMyBanners/releases">Release app</a></li>
          <li><a href="kmybanners-dev.apk" download>kmybanners-dev.apk</a> · $version · $size<br>
          KMyBanners Dev: the latest changes on main, built on every push. It installs next to the release app.</li>
          </ul></body></html>
          EOF
          echo "Dev APK $version ($size)" >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/configure-pages@v6

      - uses: actions/upload-pages-artifact@v5
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
